<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 520 40'
    style='background-color: #00000000;'
    width='520px' height='40px'>

    <style>
@font-face {
  font-family: 'Noto Sans SC';
  font-style: normal;
  font-weight: 500;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                            <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d2.end'
                    dur='4200ms' fill='remove'
                    values='m0,20 h0 ; m0,20 h520 ; m0,20 h520 ; m0,20 h0' keyTimes='0;0.57142857142857;0.85714285714286;1' />
                    </path>
    <text font-family='"Noto Sans SC", monospace' fill='#4F46E5' font-size='20'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            写 Go，也写 Rust
        </textPath>
    </text>
                <path id='path1'>
                            <!-- Single line -->
                                <animate id='d1' attributeName='d' begin='d0.end'
                    dur='4200ms' fill='remove'
                    values='m0,20 h0 ; m0,20 h520 ; m0,20 h520 ; m0,20 h0' keyTimes='0;0.57142857142857;0.85714285714286;1' />
                    </path>
    <text font-family='"Noto Sans SC", monospace' fill='#4F46E5' font-size='20'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            爱好是把麻烦事写成工具
        </textPath>
    </text>
                <path id='path2'>
                            <!-- Single line -->
                                <animate id='d2' attributeName='d' begin='d1.end'
                    dur='4200ms' fill='remove'
                    values='m0,20 h0 ; m0,20 h520 ; m0,20 h520 ; m0,20 h0' keyTimes='0;0.57142857142857;0.85714285714286;1' />
                    </path>
    <text font-family='"Noto Sans SC", monospace' fill='#4F46E5' font-size='20'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path2'>
            最近在做 Avenlet —— Windows 上的 AI Agent
        </textPath>
    </text>
</svg>
